name: Build and release

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  macos:
    name: macOS 14+ arm64
    runs-on: xcode-27

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          set -euo pipefail
          uname -m
          sw_vers
          xcode-select -p
          xcodebuild -version
          swift --version
          xcrun actool --version

      - name: Run unit tests
        run: |
          set -euo pipefail
          swift test

      - name: Build arm64 app
        run: |
          set -euo pipefail

          VERSION="0.0.0"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          MACDJVIEW_VERSION="$VERSION" \
          MACDJVIEW_BUILD_NUMBER="$GITHUB_RUN_NUMBER" \
            ./scripts/make-app-bundle.sh

          test "$(lipo -archs MacDjView.app/Contents/MacOS/MacDjView)" = "arm64"
          test "$(plutil -extract LSMinimumSystemVersion raw MacDjView.app/Contents/Info.plist)" = "14.0"
          test "$(plutil -extract CFBundleIconName raw MacDjView.app/Contents/Info.plist)" = "AppIcon"
          test "$(plutil -extract CFBundleIconFile raw MacDjView.app/Contents/Info.plist)" = "AppIcon"
          test -f MacDjView.app/Contents/Resources/PrivacyInfo.xcprivacy
          test -s MacDjView.app/Contents/Resources/Assets.car
          test -s MacDjView.app/Contents/Resources/AppIcon.icns
          file MacDjView.app/Contents/Resources/AppIcon.icns

          vtool -show-build MacDjView.app/Contents/MacOS/MacDjView | grep -Eq 'minos[[:space:]]+14\.0'

      - name: Verify sandbox entitlements
        run: |
          set -euo pipefail
          ENTITLEMENTS="$(codesign -dvvv --entitlements :- MacDjView.app 2>&1)"
          printf '%s\n' "$ENTITLEMENTS"

          grep -q '<key>com.apple.security.app-sandbox</key>' <<< "$ENTITLEMENTS"
          grep -q '<key>com.apple.security.files.user-selected.read-only</key>' <<< "$ENTITLEMENTS"

          if grep -q '<key>com.apple.security.network.client</key>' <<< "$ENTITLEMENTS"; then
            echo 'Unexpected network client entitlement' >&2
            exit 1
          fi

          if grep -q '<key>com.apple.security.network.server</key>' <<< "$ENTITLEMENTS"; then
            echo 'Unexpected network server entitlement' >&2
            exit 1
          fi

          codesign --verify --strict --verbose=2 MacDjView.app

      - name: Package release artifact
        run: |
          set -euo pipefail
          ARCHIVE="MacDjView-macOS-arm64.app.zip"
          ditto -c -k --sequesterRsrc --keepParent MacDjView.app "$ARCHIVE"
          shasum -a 256 "$ARCHIVE" | tee "$ARCHIVE.sha256"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacDjView-macOS-arm64
          path: |
            MacDjView-macOS-arm64.app.zip
            MacDjView-macOS-arm64.app.zip.sha256
          if-no-files-found: error
          retention-days: 14

  ios-compatibility:
    name: iPadOS 17+ with iOS 27 SDK
    runs-on: xcode-27

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Show Xcode and iOS SDK
        run: |
          set -euo pipefail
          uname -m
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK: $SDK_VERSION"
          [[ "$SDK_VERSION" == 27.* ]]

      - name: Compile for physical iOS/iPadOS device
        run: |
          set -euo pipefail
          xcodebuild \
            -scheme MacDjView \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build/ios27 \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 \
            build

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - macos
      - ios-compatibility
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: MacDjView-macOS-arm64
          path: release

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARCHIVE="release/MacDjView-macOS-arm64.app.zip"
          CHECKSUM="$ARCHIVE.sha256"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" "$CHECKSUM" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "$ARCHIVE" \
              "$CHECKSUM" \
              --verify-tag \
              --generate-notes \
              --notes $'### macOS compatibility\n\nApple Silicon (arm64), macOS 14 or later.\n\n### Gatekeeper\n\nThis personal build is ad-hoc signed with App Sandbox, but it is not Apple-notarized because notarization requires a paid Apple Developer Program membership. macOS may therefore show “Apple could not verify MacDjView.app is free of malware”. Verify the SHA-256 checksum and signature first; then use Finder → right-click the app → Open, or System Settings → Privacy & Security → Open Anyway.' \
              --title "MacDjView $GITHUB_REF_NAME"
          fi
